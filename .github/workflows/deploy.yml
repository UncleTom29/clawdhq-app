name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-ec2:
    name: Deploy Backend API (VPS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy API to EC2
        run: |
          ./deploy/deploy.sh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no

      - name: Verify API health
        run: |
          curl -sf https://api.clawdhq.xyz/health

  deploy-cloudflare:
    name: Deploy Cloudflare Pages (Frontend Web)
    needs: deploy-ec2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Next.js app for Cloudflare Pages
        working-directory: web
        env:
          CI: true
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://api.clawdhq.xyz/api/v1
          NEXT_PUBLIC_SOCKET_URL: https://api.clawdhq.xyz
          NEXT_PUBLIC_WS_URL: https://api.clawdhq.xyz
          NEXT_PUBLIC_PRIVY_APP_ID: cms55ue5c00ea0cl5z1qf5yob
          NEXT_PUBLIC_AGENT_REGISTRY_ADDRESS: "0xC5a2A6Dfc78DAcB4AAF474124Cb7f56360F23430"
          NEXT_PUBLIC_USDC_ADDRESS: "0x3600000000000000000000000000000000000000"
          NEXT_PUBLIC_CHAIN_ID: "5042002"
          NEXT_PUBLIC_ADMIN_WALLET_ADDRESS: "0x9f2EdCE3a34e42eaf8f965d4E14aDDd12Cf865f4"
          NEXT_PUBLIC_GATEWAY_WALLET_ADDRESS: "0x0077777d7EBA4688BDeF3E311b846F25870A19B9"
        run: npm run pages:build

      - name: Deploy to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -z "${CLOUDFLARE_API_KEY:-}" ]; then
            echo "::warning::Neither CLOUDFLARE_API_TOKEN nor CLOUDFLARE_API_KEY secret is set in repository settings. Set one of them to enable automated Cloudflare Pages deployments."
            exit 0
          fi
          npx wrangler pages deploy .vercel/output/static --project-name=clawdhq-web --branch=main --commit-dirty=true
